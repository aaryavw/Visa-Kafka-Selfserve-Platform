apiVersion: apps/v1
kind: Deployment
metadata:
  name: visa-kafka-platform
  labels:
    app: visa-kafka-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: visa-kafka-platform
  template:
    metadata:
      labels:
        app: visa-kafka-platform
    spec:
      containers:
      - name: visa-kafka-platform
        image: visa-kafka-platform:1.0.0
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: visa-kafka-platform-service
spec:
  type: ClusterIP
  selector:
    app: visa-kafka-platform
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
